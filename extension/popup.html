<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    h1 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #f1f5f9; }
    h1 span { color: #38bdf8; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: #1e293b;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-ok { background: #22c55e; }
    .dot-err { background: #ef4444; }
    .dot-pending { background: #f59e0b; }
    .status-text { color: #94a3b8; }
    .info {
      background: #1e293b;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #94a3b8;
    }
    .info strong { color: #e2e8f0; }
    button {
      width: 100%;
      padding: 8px;
      background: #1d4ed8;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #2563eb; }
    button:active { background: #1e40af; }
    .sep { border-top: 1px solid #1e293b; margin: 12px 0; }
    .footer { font-size: 11px; color: #475569; text-align: center; margin-top: 12px; }
    .mode-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      background: #065f46;
      color: #34d399;
    }
  </style>
</head>
<body>
  <h1>⚙️ <span>OCPS</span> Repair Validator</h1>

  <div class="status" id="status-bar">
    <div class="dot dot-pending" id="status-dot"></div>
    <span class="status-text" id="status-text">Checking Odoo session…</span>
  </div>

  <div class="info">
    <span class="mode-badge">Standalone</span><br><br>
    This extension validates repairs <strong>directly via Odoo JSON-RPC</strong>
    using your active browser session.<br><br>
    No dashboard or external API needed. Just log in to Odoo and navigate to
    any repair page.
  </div>

  <button id="check-btn">Check Session</button>

  <div class="sep"></div>

  <div class="info" id="session-info" style="display:none;"></div>

  <div class="footer">v2.0 • Standalone — validates repairs on Odoo pages</div>

  <script src="popup.js"></script>
</body>
</html>

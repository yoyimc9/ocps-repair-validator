<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCPS Validator — Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 720px; margin: 0 auto; }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #f1f5f9; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }

    section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }

    section h2 {
      font-size: 14px; font-weight: 700; margin-bottom: 14px;
      color: #94a3b8; text-transform: uppercase; letter-spacing: .05em;
    }

    input[type="text"], textarea, select {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, textarea:focus, select:focus { border-color: #3b82f6; }

    button {
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
      font-family: inherit;
    }
    button:hover { background: #2563eb; }
    button.danger { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
    button.danger:hover { background: rgba(239,68,68,.25); }

    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 12px; color: #64748b; margin-bottom: 4px;
      font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    }
    textarea { height: 100px; resize: vertical; }

    .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
    .send-btn { background: #22c55e; }
    .send-btn:hover { background: #16a34a; }
    .send-btn.urgent { background: #ef4444; }
    .send-btn.urgent:hover { background: #dc2626; }
    .block-btn { background: #ef4444; }
    .block-btn:hover { background: #dc2626; }

    .status-msg { font-size: 12px; }

    .announce-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .announce-item.urgent { border-left: 3px solid #ef4444; }
    .announce-meta { flex: 1; }
    .announce-title { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .announce-msg { font-size: 13px; color: #cbd5e1; white-space: pre-wrap; line-height: 1.5; }
    .announce-time { font-size: 11px; color: #475569; margin-top: 6px; }
    .badge-urgent {
      background: rgba(239,68,68,.2); color: #f87171;
      border: 1px solid rgba(239,68,68,.3);
      font-size: 10px; font-weight: 700; padding: 1px 7px;
      border-radius: 20px; text-transform: uppercase;
    }

    .blocked-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-left: 3px solid #ef4444;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .server-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3);
      color: #4ade80; font-size: 12px; padding: 4px 12px;
      border-radius: 20px; margin-bottom: 24px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }

    .empty { color: #475569; font-size: 13px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
<div class="container">

  <h1>📢 OCPS Validator — Admin Panel</h1>
  <p class="subtitle">Broadcast announcements and manage blocked serials.</p>

  <div class="server-badge">
    <span class="dot"></span>
    Connected to local server — http://10.56.65.139:3131
  </div>

  <!-- New Announcement -->
  <section>
    <h2>New Announcement</h2>
    <div class="field">
      <label>Title (optional)</label>
      <input type="text" id="msg-title" placeholder="e.g. End of shift reminder">
    </div>
    <div class="field">
      <label>Message</label>
      <textarea id="msg-body" placeholder="Type your announcement here…"></textarea>
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="msg-priority">
        <option value="normal">📢 Normal</option>
        <option value="urgent">🚨 Urgent</option>
      </select>
    </div>
    <div class="row">
      <button class="send-btn" id="send-btn" onclick="sendAnnouncement()">Broadcast</button>
      <span class="status-msg" id="send-status"></span>
    </div>
  </section>

  <!-- Active Announcements -->
  <section>
    <h2>Active Announcements</h2>
    <div id="announce-list"><div class="empty">Loading…</div></div>
  </section>

  <!-- Blocked Serials -->
  <section>
    <h2>🔒 Blocked Serials</h2>
    <div class="field">
      <label>Serial Numbers <span style="font-weight:400;text-transform:none;letter-spacing:0;">(one per line, or comma/semicolon separated)</span></label>
      <textarea id="serial-input" placeholder="SN12345&#10;SN67890&#10;ABC123"></textarea>
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="serial-note" placeholder="Reason for blocking…">
    </div>
    <div class="row">
      <button class="block-btn" onclick="addBlockedSerials()">🔒 Block Serials</button>
      <span class="status-msg" id="block-status"></span>
    </div>
    <div style="margin-top:20px;" id="blocked-list"><div class="empty">Loading…</div></div>
  </section>

</div>

<script>
  const API = "http://10.56.65.139:3131/api";

  let announcements = [];
  let blockedList   = [];

  // ── Escape HTML ──────────────────────────────────────────────────────────
  function esc(s) {
    const d = document.createElement("div");
    d.textContent = String(s);
    return d.innerHTML;
  }

  // ── Announcements ────────────────────────────────────────────────────────
  async function loadAnnouncements() {
    try {
      const r = await fetch(`${API}/announcements`);
      const data = await r.json();
      announcements = data.announcements || [];
      renderAnnouncements();
    } catch (e) {
      document.getElementById("announce-list").innerHTML =
        `<div class="empty" style="color:#f87171;">Cannot reach server: ${e.message}</div>`;
    }
  }

  async function sendAnnouncement() {
    const title    = document.getElementById("msg-title").value.trim();
    const message  = document.getElementById("msg-body").value.trim();
    const priority = document.getElementById("msg-priority").value;
    if (!message) { setStatus("send-status", "Message is required.", true); return; }

    const btn = document.getElementById("send-btn");
    btn.textContent = "Sending…"; btn.disabled = true;

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title || null, message, priority, active: true,
      created: new Date().toISOString()
    };
    const updated = { announcements: [entry, ...announcements] };
    const ok = await apiPut("announcements", updated);
    btn.disabled = false;
    btn.textContent = "Broadcast";
    if (ok) {
      document.getElementById("msg-title").value = "";
      document.getElementById("msg-body").value = "";
      setStatus("send-status", "✅ Sent! Technicians see it within ~15 seconds.", false);
      setTimeout(() => setStatus("send-status", "", false), 5000);
    } else {
      setStatus("send-status", "❌ Failed. Is the server running?", true);
    }
  }

  async function deactivate(id) {
    const updated = { announcements: announcements.map(a => a.id === id ? { ...a, active: false } : a) };
    await apiPut("announcements", updated);
  }

  function renderAnnouncements() {
    const el = document.getElementById("announce-list");
    const active = announcements.filter(a => a.active !== false);
    if (!active.length) { el.innerHTML = `<div class="empty">No active announcements.</div>`; return; }
    el.innerHTML = active.map(a => `
      <div class="announce-item ${a.priority === "urgent" ? "urgent" : ""}">
        <div class="announce-meta">
          <div class="announce-title">
            ${a.priority === "urgent" ? `<span class="badge-urgent">Urgent</span> ` : ""}
            ${a.title ? esc(a.title) : "(no title)"}
          </div>
          <div class="announce-msg">${esc(a.message)}</div>
          <div class="announce-time">${new Date(a.created).toLocaleString()}</div>
        </div>
        <div>
          <button class="danger" onclick="deactivate('${a.id}')">Deactivate</button>
        </div>
      </div>`).join("");
  }

  // ── Blocked Serials ──────────────────────────────────────────────────────
  async function loadBlocked() {
    try {
      const r = await fetch(`${API}/blocked`);
      const data = await r.json();
      blockedList = data.blocked || [];
      renderBlocked();
    } catch (e) {
      document.getElementById("blocked-list").innerHTML =
        `<div class="empty" style="color:#f87171;">Cannot reach server: ${e.message}</div>`;
    }
  }

  async function addBlockedSerials() {
    const rawInput = document.getElementById("serial-input").value;
    const note     = document.getElementById("serial-note").value.trim();
    const serials  = rawInput.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
    if (!serials.length) { setStatus("block-status", "Enter at least one serial.", true); return; }

    setStatus("block-status", "Saving…", false);
    const now = new Date().toISOString();
    const existing = blockedList.map(b => b.serial.toLowerCase());
    const toAdd = serials
      .filter(s => !existing.includes(s.toLowerCase()))
      .map(serial => ({ serial, note: note || null, created: now }));
    if (!toAdd.length) { setStatus("block-status", "All serials already blocked.", true); return; }

    const updated = { blocked: [...toAdd, ...blockedList] };
    const ok = await apiPut("blocked", updated);
    if (ok) {
      document.getElementById("serial-input").value = "";
      document.getElementById("serial-note").value = "";
      setStatus("block-status", `✅ ${toAdd.length} serial(s) blocked.`, false);
      setTimeout(() => setStatus("block-status", "", false), 5000);
    } else {
      setStatus("block-status", "❌ Failed. Is the server running?", true);
    }
  }

  async function unblockSerial(serial) {
    const updated = { blocked: blockedList.filter(b => b.serial !== serial) };
    await apiPut("blocked", updated);
  }

  function renderBlocked() {
    const el = document.getElementById("blocked-list");
    if (!blockedList.length) { el.innerHTML = `<div class="empty">No blocked serials.</div>`; return; }
    el.innerHTML = blockedList.map(b => `
      <div class="blocked-item">
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:#fca5a5;font-family:monospace;">${esc(b.serial)}</div>
          ${b.note ? `<div style="font-size:12px;color:#94a3b8;margin-top:2px;">${esc(b.note)}</div>` : ""}
          <div style="font-size:11px;color:#475569;margin-top:4px;">${new Date(b.created).toLocaleString()}</div>
        </div>
        <button class="danger" onclick="unblockSerial('${esc(b.serial).replace(/'/g, "\\'")}')">Unblock</button>
      </div>`).join("");
  }

  // ── Shared helpers ───────────────────────────────────────────────────────
  async function apiPut(endpoint, data) {
    try {
      const r = await fetch(`${API}/${endpoint}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (!r.ok) return false;
      if (endpoint === "announcements") { announcements = data.announcements; renderAnnouncements(); }
      if (endpoint === "blocked")       { blockedList   = data.blocked;       renderBlocked(); }
      return true;
    } catch { return false; }
  }

  function setStatus(id, msg, isError) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.color = isError ? "#f87171" : "#4ade80";
  }

  // ── Priority button color ─────────────────────────────────────────────
  document.getElementById("msg-priority").addEventListener("change", function () {
    const btn = document.getElementById("send-btn");
    btn.className = "send-btn" + (this.value === "urgent" ? " urgent" : "");
    btn.textContent = this.value === "urgent" ? "🚨 Broadcast Urgent" : "Broadcast";
  });

  // ── Init ─────────────────────────────────────────────────────────────────
  loadAnnouncements();
  loadBlocked();
</script>
</body>
</html>
